<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Luve Expenses</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f2ea;color:#173f35}header{background:#173f35;color:white;padding:22px 18px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.8;font-size:13px}.wrap{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000d}.metric{font-size:22px;font-weight:800;margin-top:5px}.label{font-size:12px;color:#6c746f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:#173f35;color:#fff}.secondary{background:#dfe8e2;color:#173f35}.section{margin-top:18px}.section h2{font-size:17px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.expense{padding:12px;background:white;border-radius:12px}.amount{font-weight:800}.muted{color:#69736e;font-size:12px}form{display:grid;gap:10px}input,select,textarea{width:100%;padding:12px;border:1px solid #d4dad5;border-radius:10px;font:inherit;background:white}label{font-size:12px;font-weight:700}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:5}.sheet{background:#f5f2ea;width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.close{float:right;background:none;border:0;font-size:24px}.empty{text-align:center;padding:25px;color:#69736e}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:651px){.modal{align-items:center}.sheet{max-width:560px;border-radius:18px}}</style></head><body><header><div class="wrap"><h1>Luve Expenses</h1><p>Expense & petty cash management</p></div></header><main class="wrap"><div class="grid"><div class="card"><div class="label">Today</div><div class="metric" id="today">₱0</div></div><div class="card"><div class="label">This Month</div><div class="metric" id="month">₱0</div></div><div class="card"><div class="label">Petty Cash</div><div class="metric" id="petty">₱5,000</div></div><div class="card"><div class="label">Transactions</div><div class="metric" id="count">0</div></div></div><div class="actions"><button class="btn primary" onclick="openForm()">+ Add Expense</button><button class="btn secondary" onclick="openPetty()">Petty Cash</button><button class="btn secondary" onclick="install()" id="installBtn" style="display:none">Install App</button></div><section class="section"><h2>Recent Expenses</h2><div id="list" class="list"></div></section></main><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeForm()">×</button><h2>Record Expense</h2><form id="form"><div><label>Date</label><input type="date" id="date" required></div><div><label>Category</label><select id="category"><option>Ingredients</option><option>Coffee & Beverages</option><option>Pastries/Food Supplies</option><option>Packaging</option><option>Utilities</option><option>Rent</option><option>Salaries/Wages</option><option>Transportation/Delivery</option><option>Repairs & Maintenance</option><option>Marketing</option><option>Equipment</option><option>Office/Admin</option><option>Other</option></select></div><div><label>Description</label><input id="description" required placeholder="e.g. Milk supply"></div><div><label>Amount (₱)</label><input type="number" id="amount" min="0.01" step="0.01" required></div><div><label>Payment Method</label><select id="payment"><option>Petty Cash</option><option>Cash</option><option>GCash</option><option>Bank</option><option>Card</option><option>Other</option></select></div><div><label>Supplier / Payee</label><input id="payee" placeholder="Optional"></div><div><label>Notes</label><textarea id="notes" rows="2"></textarea></div><button class="btn primary">Save Expense</button></form></div></div><div class="modal" id="pettyModal"><div class="sheet"><button class="close" onclick="closePetty()">×</button><h2>Petty Cash</h2><div class="card"><div class="label">Current Balance</div><div class="metric" id="pettyDetail">₱5,000</div></div><p class="muted">Petty cash transactions will be linked to expenses. Firebase synchronization will be added in the next build phase.</p><button class="btn secondary" onclick="closePetty()">Close</button></div></div><script>let expenses=JSON.parse(localStorage.getItem('luveExpenses')||'[]');let petty=Number(localStorage.getItem('luvePetty')||5000);let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-block'});function peso(n){return new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:2}).format(n)}function render(){const now=new Date(),today=now.toISOString().slice(0,10),ym=now.toISOString().slice(0,7);const t=expenses.filter(x=>x.date===today).reduce((a,x)=>a+x.amount,0),m=expenses.filter(x=>x.date.startsWith(ym)).reduce((a,x)=>a+x.amount,0);document.getElementById('today').textContent=peso(t);document.getElementById('month').textContent=peso(m);document.getElementById('petty').textContent=peso(petty);document.getElementById('pettyDetail').textContent=peso(petty);document.getElementById('count').textContent=expenses.length;const list=document.getElementById('list');list.innerHTML=expenses.slice().reverse().slice(0,20).map(x=>`<div class="expense"><div class="row"><strong>${esc(x.description)}</strong><span class="amount">${peso(x.amount)}</span></div><div class="muted">${x.date} · ${esc(x.category)} · ${esc(x.payment)}${x.payee?' · '+esc(x.payee):''}</div></div>`).join('')||'<div class="card empty">No expenses recorded yet.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openForm(){document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('modal').style.display='flex'}function closeForm(){document.getElementById('modal').style.display='none'}function openPetty(){document.getElementById('pettyModal').style.display='flex'}function closePetty(){document.getElementById('pettyModal').style.display='none'}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const x={id:crypto.randomUUID(),date:date.value,category:category.value,description:description.value,amount:Number(amount.value),payment:payment.value,payee:payee.value,notes:notes.value,createdAt:new Date().toISOString()};expenses.push(x);if(x.payment==='Petty Cash')petty-=x.amount;localStorage.setItem('luveExpenses',JSON.stringify(expenses));localStorage.setItem('luvePetty',petty);e.target.reset();closeForm();render()});async function install(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'}}if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
